server {
    listen                    %ip%:%httpport%;
    listen                    %ip%:%httpsport% ssl;
    server_name               %host% %aliases%;
    root                      '%hostdir%/web';
    #limit_conn               addr 64;
    autoindex                 off;
    index                     index.php index.html index.htm;

    ssl_certificate           '%sprogdir%/userdata/config/cert_files/server.crt';
    ssl_certificate_key       '%sprogdir%/userdata/config/cert_files/server.key';
    add_header X-Content-Type-Options 'nosniff' always;

    # Логи
    access_log C:/OpenServer/userdata/logs/nginx/yii-test.com-access.log;
    error_log C:/OpenServer/userdata/logs/nginx/yii-test.com-error.log;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9001;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    location ~ /\. {
        deny all;
    }

    # Обработка статики в папке uploads
    location ~ ^/uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Запрет доступа к папкам Yii2
    location ~ ^/(config|views|runtime|migrations|controllers|models|components|commands|assets)/ {
        deny all;
    }

    # Service configuration (do not edit!)
    location /openserver/ {
        root      '%sprogdir%/modules/system/html';
        autoindex off;
        index     index.php index.html index.htm;
        allow all;
        allow 127.0.0.0/8;
        allow ::1/128;
        allow %ips%;
        deny all;
        location ~* ^/openserver/.+\.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|webm|svgz?|ttf|ttc|otf|eot|woff2?)$ {
            expires 1d;
            access_log off;
        }
        location /openserver/server-status {
            stub_status on;
        }
        location ~ ^/openserver/.*\.php$ {
            try_files      $fastcgi_script_name =404;
            fastcgi_index  index.php;
            fastcgi_pass   backend;
            include        '%sprogdir%/userdata/config/nginx_fastcgi_params.txt';
        }
    }
}